name: Watch TCU seats

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (GitHub may delay runs a bit)
  workflow_dispatch:
    inputs:
      test_push:
        description: "Also send a test push to your phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python cloud_check.py ${{ inputs.test_push && '--test-push' || '' }}

      - name: Save state if it changed
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "seat-watcher-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update open sections"
            git push
          fi
